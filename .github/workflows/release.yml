name: Create GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and manifest version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version src/manifest.json)"
          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match manifest version $MANIFEST_VERSION." >&2
            exit 1
          fi

      - name: Type-check and build
        run: |
          npm run typecheck
          npm run build

      - name: Package extension
        shell: bash
        run: |
          ARCHIVE="swift-selection-search-chrome-${GITHUB_REF_NAME#v}.zip"
          (
            cd src
            zip -r "../$ARCHIVE" . \
              -x "*.ts" \
              -x "swift-selection-search.html"
          )
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
            --verify-tag \
            --generate-notes \
            --title "Swift Selection Search $GITHUB_REF_NAME"
