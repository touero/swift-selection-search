<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		:root {
			--sss-popup-background-color: #fff;
			--sss-popup-highlight-color: #3399ff;
			--sss-popup-text-color: #222;
		}

		body {
			min-width: 180px;
			margin: 0;
			padding: 8px;
			font: 14px Arial, sans-serif;
			background: var(--sss-popup-background-color);
			color: var(--sss-popup-text-color);
		}

		button {
			display: flex;
			align-items: center;
			gap: 9px;
			width: 100%;
			padding: 9px 10px;
			margin: 0;
			border: 0;
			border-radius: 4px;
			background: transparent;
			color: inherit;
			text-align: left;
			cursor: pointer;
		}

		button:hover {
			background: var(--sss-popup-highlight-color);
		}

		button + button {
			margin-top: 2px;
		}

		button.sponsor {
			margin-top: 8px;
			border-top: 1px solid rgba(128, 128, 128, 0.3);
			border-radius: 0 0 4px 4px;
		}

		.icon {
			width: 16px;
			height: 16px;
			flex: 0 0 auto;
			fill: currentColor;
		}
	</style>
</head>
